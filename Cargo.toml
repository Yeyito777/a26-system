[package]
name = "a26-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone X11 system-information view for the Samsung Galaxy A26 Linux environment"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.14"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
